query GetTransferApprovalState($transferId: String!, $operationId: String!, $eventId: String!) @auth(level: NO_ACCESS) {
  transfer(id: $transferId) { id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes proposal { id proposedQuantity unit compatibilityResult status supplyOfferId demandRequestId } }
  transferApprovalOperation(id: $operationId) { id requestFingerprint transferId eventId approvedQuantity sourceConfirmationStatus destinationConfirmationStatus actorLabel evidenceRef occurredAt }
  transferEvent(id: $eventId) { id transferId eventType occurredAt actorLabel payload evidenceRef }
}

query GetTransferRequestState($proposalId: String!, $operationId: String!, $transferId: String!, $eventId: String!) @auth(level: NO_ACCESS) {
  allocationProposal(id: $proposalId) { id proposedQuantity unit compatibilityResult status supplyOfferId demandRequestId }
  transfers(where: {proposalId: {eq: $proposalId}}, limit: 2) { id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes }
  transferRequestOperation(id: $operationId) { id requestFingerprint proposalId transferId eventId actorLabel evidenceRef occurredAt }
  transfer(id: $transferId) { id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes }
  transferEvent(id: $eventId) { id transferId eventType occurredAt actorLabel payload evidenceRef }
}

mutation CreateTransferRequest(
  $proposalId: String!
  $operationId: String!
  $requestFingerprint: String!
  $transferId: String!
  $eventId: String!
  $actorLabel: String!
  $evidenceRef: String
  $notes: String
  $approvedQuantity: Int!
  $eventPayload: Any!
  $occurredAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  query @redact
    @check(expr: "response.query.allocationProposal != null", message: "PROPOSAL_NOT_FOUND")
    @check(expr: "(response.query.allocationProposal.status == 'PROPOSED' || response.query.allocationProposal.status == 'SELECTED') && response.query.allocationProposal.compatibilityResult == 'ELIGIBLE'", message: "PROPOSAL_NOT_REQUESTABLE") {
    allocationProposal(id: $proposalId) { status compatibilityResult }
  }
  allocationProposal_updateMany(where: {id: {eq: $proposalId} status: {in: [PROPOSED, SELECTED]} compatibilityResult: {eq: ELIGIBLE} proposedQuantity: {eq: $approvedQuantity}}, data: {status: SELECTED}) @check(expr: "this == 1", message: "PROPOSAL_NOT_REQUESTABLE")
  transfer_insert(data: {
    id: $transferId proposalId: $proposalId
    approvedQuantity: $approvedQuantity reservedQuantity: 0 dispatchedQuantity: 0 receivedQuantity: 0 actuallyUsedQuantity: 0
    status: REQUESTED sourceConfirmationStatus: CONFIRMED destinationConfirmationStatus: CONFIRMED
    requestedAt: $occurredAt deliveredAt: null reuseConfirmedAt: null notes: $notes
  })
  impactAssessmentHead_insert(data: {
    id_expr: "'ACTUAL_CONFIRMED_USE:' + vars.transferId"
    basis: ACTUAL_CONFIRMED_USE proposalId: null transferId: $transferId
    currentAssessmentId: null revision: 0 inputFingerprint: null updatedAt: null
  })
  transferEvent_insert(data: {
    id: $eventId transferId: $transferId eventType: REQUESTED occurredAt: $occurredAt
    actorLabel: $actorLabel payload: $eventPayload evidenceRef: $evidenceRef
  })
  transferRequestOperation_insert(data: {
    id: $operationId requestFingerprint: $requestFingerprint proposalId: $proposalId
    transferId: $transferId eventId: $eventId actorLabel: $actorLabel evidenceRef: $evidenceRef occurredAt: $occurredAt
  })
}

query GetOptimisationRunPersistenceState($runId: String!, $operationId: String!) @auth(level: NO_ACCESS) {
  optimisationRun(id: $runId) { id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions }
  optimisationRunOperation(id: $operationId) { id requestFingerprint runId }
  allocationProposals(where: {runId: {eq: $runId}}, orderBy: {id: ASC}, limit: 1000) { id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt }
  impactAssessments(where: {proposal: {runId: {eq: $runId}}}, orderBy: {id: ASC}, limit: 1000) { id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt }
}

query GetOptimisationRun($runId: String!) @auth(level: NO_ACCESS) {
  optimisationRun(id: $runId) { id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions }
  allocationProposals(where: {runId: {eq: $runId}}, orderBy: {id: ASC}, limit: 1000) { id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt }
  impactAssessments(where: {proposal: {runId: {eq: $runId}}}, orderBy: {id: ASC}, limit: 1000) { id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt }
}

mutation PersistOptimisationRun(
  $operationId: String!
  $runId: String!
  $requestFingerprint: String!
  $run: OptimisationRun_Data! @allow(fields: "id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions")
  $proposals: [AllocationProposal_Data!]! @allow(fields: "id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt", maxCount: 1000)
  $assessments: [ImpactAssessment_Data!]! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt", maxCount: 1000)
  $heads: [ImpactAssessmentHead_Data!]! @allow(fields: "id basis proposalId transferId currentAssessmentId revision inputFingerprint updatedAt", maxCount: 1000)
) @auth(level: NO_ACCESS) @transaction {
  optimisationRun_insert(data: $run)
  allocationProposal_insertMany(data: $proposals)
  impactAssessment_insertMany(data: $assessments)
  impactAssessmentHead_insertMany(data: $heads)
  optimisationRunOperation_insert(data: {id: $operationId requestFingerprint: $requestFingerprint runId: $runId})
}

mutation PersistOptimisationComparison(
  $runs: [OptimisationRun_Data!]! @allow(fields: "id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions", maxCount: 5000)
  $proposals: [AllocationProposal_Data!]! @allow(fields: "id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt", maxCount: 1000)
  $assessments: [ImpactAssessment_Data!]! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt", maxCount: 1000)
  $heads: [ImpactAssessmentHead_Data!]! @allow(fields: "id basis proposalId transferId currentAssessmentId revision inputFingerprint updatedAt", maxCount: 1000)
  $operations: [OptimisationRunOperation_Data!]! @allow(fields: "id requestFingerprint runId", maxCount: 2)
) @auth(level: NO_ACCESS) @transaction {
  optimisationRun_insertMany(data: $runs)
  allocationProposal_insertMany(data: $proposals)
  impactAssessment_insertMany(data: $assessments)
  impactAssessmentHead_insertMany(data: $heads)
  optimisationRunOperation_insertMany(data: $operations)
}

mutation ApproveTransfer(
  $transferId: String!
  $operationId: String!
  $requestFingerprint: String!
  $eventId: String!
  $approvedQuantity: Int!
  $sourceConfirmationStatus: Confirmation!
  $destinationConfirmationStatus: Confirmation!
  $actorLabel: String!
  $evidenceRef: String
  $eventPayload: Any!
  $occurredAt: Timestamp!
) @auth(level: NO_ACCESS) @transaction {
  query
    @redact
    @check(expr: "response.query.transfer != null", message: "TRANSFER_NOT_FOUND")
    @check(expr: "response.query.transfer.status == 'REQUESTED'", message: "TRANSFER_INVALID_STAGE")
    @check(expr: "response.query.transfer.proposal.status == 'SELECTED' && response.query.transfer.proposal.compatibilityResult == 'ELIGIBLE'", message: "PROPOSAL_NOT_APPROVABLE")
    @check(expr: "vars.approvedQuantity > 0 && vars.approvedQuantity <= response.query.transfer.proposal.proposedQuantity", message: "APPROVED_QUANTITY_INVALID")
    @check(expr: "vars.sourceConfirmationStatus == 'CONFIRMED' && vars.destinationConfirmationStatus == 'CONFIRMED'", message: "CONFIRMATIONS_REQUIRED") {
    transfer(id: $transferId) {
      status
      proposal { proposedQuantity compatibilityResult status }
    }
  }
  transferApprovalOperation_insert(data: {
    id: $operationId
    requestFingerprint: $requestFingerprint
    transferId: $transferId
    eventId: $eventId
    approvedQuantity: $approvedQuantity
    sourceConfirmationStatus: $sourceConfirmationStatus
    destinationConfirmationStatus: $destinationConfirmationStatus
    actorLabel: $actorLabel
    evidenceRef: $evidenceRef
    occurredAt: $occurredAt
  })
  transfer_update(id: $transferId, data: {
    approvedQuantity: $approvedQuantity
    status: APPROVED
    sourceConfirmationStatus: $sourceConfirmationStatus
    destinationConfirmationStatus: $destinationConfirmationStatus
  })
  transferEvent_insert(data: {
    id: $eventId
    transferId: $transferId
    eventType: APPROVED
    occurredAt: $occurredAt
    actorLabel: $actorLabel
    payload: $eventPayload
    evidenceRef: $evidenceRef
  })
}

