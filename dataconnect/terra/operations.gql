# Administrative connector operations. Not public application APIs.

query SeedSnapshot @auth(level: NO_ACCESS) {
  projects(limit: 1000, orderBy: {id: ASC}) { id code name township location startDate targetEndDate status managingOrganisation }
  materials(limit: 1000, orderBy: {id: ASC}) { id category canonicalName specifications standardUnit massKgPerUnit massSource referenceCode isSynthetic }
  documents(limit: 1000, orderBy: {id: ASC}) { id projectId documentType displayFilename fileUri fileHash sourceAvailability processingStatus recordedAt isSimulated }
  extractedRows(limit: 1000, orderBy: {id: ASC}) { id documentId sourceLocator rawDescription rawQuantity rawUnit parsedFields suggestedMaterialId confidenceScore reviewStatus reviewMode isSimulated }
  supplyOffers(limit: 1000, orderBy: {id: ASC}) { id sourceProjectId materialId originDocumentRowId declaredQuantity confirmedQuantity reservedActiveQuantity transferredOutQuantity unit surplusStatus condition availableFrom availableUntil batchOrLotCode materialOwnerLabel evidenceRefs }
  demandRequests(limit: 1000, orderBy: {id: ASC}) { id destinationProjectId materialId originDocumentRowId requiredQuantity fulfilledQuantity unit neededFrom requiredBy requestStatus isOutstandingNeedConfirmed }
  routeDistances(limit: 1000, orderBy: {id: ASC}) { id fromProjectId toProjectId distanceKm assumptionType transportMode isSynthetic }
  optimisationRuns(limit: 1000, orderBy: {id: ASC}) { id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions }
  allocationProposals(limit: 1000, orderBy: {id: ASC}) { id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt }
  transfers(limit: 1000, orderBy: {id: ASC}) { id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes }
  transferEvents(limit: 1000, orderBy: {id: ASC}) { id transferId eventType occurredAt actorLabel payload evidenceRef }
  emissionFactors(limit: 1000, orderBy: {id: ASC}) { id factorType materialId materialCategory transportMode value unit sourceLabel sourceUrl geography lifecycleBoundary version validFrom isDemoFactor }
  impactAssessments(limit: 1000, orderBy: {id: ASC}) { id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt }
}

