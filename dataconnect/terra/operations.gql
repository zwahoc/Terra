mutation ImportBaseline(
  $projects: [Project_Data!]! @allow(fields: "id code name township location startDate targetEndDate status managingOrganisation", maxCount: 5000)
  $materials: [Material_Data!]! @allow(fields: "id category canonicalName specifications standardUnit massKgPerUnit massSource referenceCode isSynthetic", maxCount: 5000)
  $documents: [Document_Data!]! @allow(fields: "id projectId documentType displayFilename fileUri fileHash sourceAvailability processingStatus recordedAt isSimulated", maxCount: 5000)
  $extractedRows: [ExtractedRow_Data!]! @allow(fields: "id documentId sourceLocator rawDescription rawQuantity rawUnit parsedFields suggestedMaterialId confidenceScore reviewStatus reviewMode isSimulated", maxCount: 5000)
  $supplyOffers: [SupplyOffer_Data!]! @allow(fields: "id sourceProjectId materialId originDocumentRowId declaredQuantity confirmedQuantity reservedActiveQuantity transferredOutQuantity unit surplusStatus condition availableFrom availableUntil batchOrLotCode materialOwnerLabel evidenceRefs", maxCount: 5000)
  $demandRequests: [DemandRequest_Data!]! @allow(fields: "id destinationProjectId materialId originDocumentRowId requiredQuantity fulfilledQuantity unit neededFrom requiredBy requestStatus isOutstandingNeedConfirmed", maxCount: 5000)
  $routeDistances: [RouteDistance_Data!]! @allow(fields: "id fromProjectId toProjectId distanceKm assumptionType transportMode isSynthetic", maxCount: 5000)
  $emissionFactors: [EmissionFactor_Data!]! @allow(fields: "id factorType materialId materialCategory transportMode value unit sourceLabel sourceUrl geography lifecycleBoundary version validFrom isDemoFactor", maxCount: 5000)
  $optimisationRuns: [OptimisationRun_Data!]! @allow(fields: "id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions", maxCount: 5000)
  $allocationProposals: [AllocationProposal_Data!]! @allow(fields: "id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt", maxCount: 5000)
  $transfers: [Transfer_Data!]! @allow(fields: "id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes", maxCount: 5000)
  $transferEvents: [TransferEvent_Data!]! @allow(fields: "id transferId eventType occurredAt actorLabel payload evidenceRef", maxCount: 5000)
  $impactAssessments: [ImpactAssessment_Data!]! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt", maxCount: 5000)
) @auth(level: NO_ACCESS) @transaction {
  project_upsertMany(data: $projects)
  material_upsertMany(data: $materials)
  document_upsertMany(data: $documents)
  extractedRow_upsertMany(data: $extractedRows)
  supplyOffer_upsertMany(data: $supplyOffers)
  demandRequest_upsertMany(data: $demandRequests)
  routeDistance_upsertMany(data: $routeDistances)
  emissionFactor_upsertMany(data: $emissionFactors)
  optimisationRun_upsertMany(data: $optimisationRuns)
  allocationProposal_upsertMany(data: $allocationProposals)
  transfer_upsertMany(data: $transfers)
  transferEvent_upsertMany(data: $transferEvents)
  impactAssessment_upsertMany(data: $impactAssessments)
}

mutation ClearBaseline @auth(level: NO_ACCESS) @transaction {
  impactAssessment_deleteMany(all: true)
  transferEvent_deleteMany(all: true)
  transfer_deleteMany(all: true)
  allocationProposal_deleteMany(all: true)
  optimisationRun_deleteMany(all: true)
  emissionFactor_deleteMany(all: true)
  routeDistance_deleteMany(all: true)
  demandRequest_deleteMany(all: true)
  supplyOffer_deleteMany(all: true)
  extractedRow_deleteMany(all: true)
  document_deleteMany(all: true)
  material_deleteMany(all: true)
  project_deleteMany(all: true)
}
