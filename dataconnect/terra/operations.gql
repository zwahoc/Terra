mutation PersistOptimisationRun(
  $operationId: String!
  $runId: String!
  $requestFingerprint: String!
  $run: OptimisationRun_Data! @allow(fields: "id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions")
  $proposals: [AllocationProposal_Data!]! @allow(fields: "id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt", maxCount: 1000)
  $assessments: [ImpactAssessment_Data!]! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt", maxCount: 1000)
  $heads: [ImpactAssessmentHead_Data!]! @allow(fields: "id basis proposalId transferId currentAssessmentId revision inputFingerprint updatedAt", maxCount: 1000)
) @auth(level: NO_ACCESS) @transaction {
  operationalVersion_updateMany(where: {id: {eq: "GLOBAL"}}, data: {revision_update: {inc: 1}}) @check(expr: "this == 1", message: "PUBLICATION_GUARD_MISSING")
  optimisationRun_insert(data: $run)
  allocationProposal_insertMany(data: $proposals)
  impactAssessment_insertMany(data: $assessments)
  impactAssessmentHead_insertMany(data: $heads)
  optimisationRunOperation_insert(data: {id: $operationId requestFingerprint: $requestFingerprint runId: $runId})
}

mutation PersistOptimisationComparison(
