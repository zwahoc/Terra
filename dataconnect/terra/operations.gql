mutation ResetLocalWorkspace($expectedOperationalRevision: Int!, $expectedBatches: Any!) @auth(level: NO_ACCESS) @transaction {
  cutoverGuard: operationalVersion_updateMany(where: {id: {eq: "GLOBAL"} revision: {eq: $expectedOperationalRevision}},data: {revision_update: {inc: 1}}) @check(expr: "this == 1",message: "CUTOVER_CONTEXT_STALE")
  cutoverHeads: query @redact @check(expr: "size(response.cutoverHeads.ingestionBatches) < 1000 && size(response.cutoverHeads.ingestionBatches) == size(vars.expectedBatches.batches) && response.cutoverHeads.ingestionBatches.all(row, vars.expectedBatches.batches.exists(prior, prior.id == row.id && int(prior.revision) == row.revision))",message: "CUTOVER_DRAFTS_CHANGED") {
    ingestionBatches(limit: 1000) { id revision }
  }

  impactRefreshIntent_deleteMany(all: true)
  matchingScope_deleteMany(all: true)
  matchingGeneration_deleteMany(all: true)
  runtimeAudit_deleteMany(all: true)
  ingestionPublication_deleteMany(all: true)
  supersededRecord_deleteMany(all: true)
  projectStockHead_deleteMany(all: true)
  projectMaterialRecord_deleteMany(all: true)
  registeredMaterial_deleteMany(all: true)
  impactCalculationOperation_deleteMany(all: true)
  impactAssessmentHead_deleteMany(all: true)
  transferApprovalOperation_deleteMany(all: true)
  optimisationRunOperation_deleteMany(all: true)
  transferRequestOperation_deleteMany(all: true)
  transferWorkflowOperation_deleteMany(all: true)
  demandCommitmentBalance_deleteMany(all: true)
  impactAssessment_deleteMany(all: true)
  transferEvent_deleteMany(all: true)
  transfer_deleteMany(all: true)
  allocationProposal_deleteMany(all: true)
  optimisationRun_deleteMany(all: true)
  emissionFactor_deleteMany(all: true)
  routeDistance_deleteMany(all: true)
  demandRequest_deleteMany(all: true)
  supplyOffer_deleteMany(all: true)
  extractedRow_deleteMany(all: true)
  document_deleteMany(all: true)
  material_deleteMany(all: true)
  project_deleteMany(all: true)
  ingestionRevision_deleteMany(all: true)
  ingestionBatch_deleteMany(all: true)
  workspaceIdentity_deleteMany(all: true)
}
mutation ImportDemoWorkspace(
  $projects: [Project_Data!]! @allow(fields: "id code name township location startDate targetEndDate status managingOrganisation", maxCount: 5000)
  $materials: [Material_Data!]! @allow(fields: "id category canonicalName specifications standardUnit massKgPerUnit massSource referenceCode isSynthetic", maxCount: 5000)
  $documents: [Document_Data!]! @allow(fields: "id projectId documentType displayFilename fileUri fileHash sourceAvailability processingStatus recordedAt isSimulated", maxCount: 5000)
  $extractedRows: [ExtractedRow_Data!]! @allow(fields: "id documentId sourceLocator rawDescription rawQuantity rawUnit parsedFields suggestedMaterialId confidenceScore reviewStatus reviewMode isSimulated", maxCount: 5000)
  $supplyOffers: [SupplyOffer_Data!]! @allow(fields: "id sourceProjectId materialId originDocumentRowId declaredQuantity confirmedQuantity reservedActiveQuantity transferredOutQuantity unit surplusStatus condition availableFrom availableUntil batchOrLotCode materialOwnerLabel evidenceRefs", maxCount: 5000)
  $demandRequests: [DemandRequest_Data!]! @allow(fields: "id destinationProjectId materialId originDocumentRowId requiredQuantity fulfilledQuantity unit neededFrom requiredBy requestStatus isOutstandingNeedConfirmed", maxCount: 5000)
  $routeDistances: [RouteDistance_Data!]! @allow(fields: "id fromProjectId toProjectId distanceKm assumptionType transportMode isSynthetic", maxCount: 5000)
  $emissionFactors: [EmissionFactor_Data!]! @allow(fields: "id factorType materialId materialCategory transportMode value unit sourceLabel sourceUrl geography lifecycleBoundary version validFrom isDemoFactor", maxCount: 5000)
  $optimisationRuns: [OptimisationRun_Data!]! @allow(fields: "id createdAt objective inputsSnapshotHash inputSnapshot factorDatasetVersion solverStatus assumptions", maxCount: 5000)
  $allocationProposals: [AllocationProposal_Data!]! @allow(fields: "id runId supplyOfferId demandRequestId proposedQuantity unit compatibilityResult status reasonCodes createdAt", maxCount: 5000)
  $transfers: [Transfer_Data!]! @allow(fields: "id proposalId approvedQuantity reservedQuantity dispatchedQuantity receivedQuantity actuallyUsedQuantity status sourceConfirmationStatus destinationConfirmationStatus requestedAt deliveredAt reuseConfirmedAt notes", maxCount: 5000)
  $transferEvents: [TransferEvent_Data!]! @allow(fields: "id transferId eventType occurredAt actorLabel payload evidenceRef", maxCount: 5000)
  $impactAssessments: [ImpactAssessment_Data!]! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt", maxCount: 5000)
  $demandCommitmentBalances: [DemandCommitmentBalance_Data!]! @allow(fields: "demandRequestId committedQuantity", maxCount: 5000)
  $impactAssessmentHeads: [ImpactAssessmentHead_Data!]! @allow(fields: "id basis proposalId transferId currentAssessmentId revision inputFingerprint updatedAt", maxCount: 5000)
  $expectedRevision: Int!
  $epoch: String!
  $createdAt: Timestamp!
  $receipt: Any!
) @auth(level: NO_ACCESS) @transaction {
  operationalVersion_updateMany(where: {id: {eq: "GLOBAL"} revision: {eq: $expectedRevision}}, data: {revision_update: {inc: 1}}) @check(expr: "this == 1", message: "DEMO_WORKSPACE_CHANGED")
  empty: query @redact @check(expr: "size(response.empty.projects) == 0 && size(response.empty.materials) == 0 && size(response.empty.documents) == 0 && size(response.empty.extractedRows) == 0 && size(response.empty.supplyOffers) == 0 && size(response.empty.demandRequests) == 0 && size(response.empty.routeDistances) == 0 && size(response.empty.optimisationRuns) == 0 && size(response.empty.allocationProposals) == 0 && size(response.empty.transfers) == 0 && size(response.empty.transferEvents) == 0 && size(response.empty.emissionFactors) == 0 && size(response.empty.impactAssessments) == 0 && size(response.empty.transferApprovalOperations) == 0 && size(response.empty.transferWorkflowOperations) == 0 && size(response.empty.transferRequestOperations) == 0 && size(response.empty.optimisationRunOperations) == 0 && size(response.empty.demandCommitmentBalances) == 0 && size(response.empty.impactAssessmentHeads) == 0 && size(response.empty.impactCalculationOperations) == 0 && size(response.empty.ingestionBatches) == 0 && size(response.empty.ingestionRevisions) == 0 && size(response.empty.registeredMaterials) == 0 && size(response.empty.projectMaterialRecords) == 0 && size(response.empty.projectStockHeads) == 0 && size(response.empty.supersededRecords) == 0 && size(response.empty.ingestionPublications) == 0 && size(response.empty.matchingScopes) == 0 && size(response.empty.matchingGenerations) == 0 && size(response.empty.runtimeAudits) == 0 && size(response.empty.impactRefreshIntents) == 0 && size(response.empty.workspaceIdentities) == 0", message: "DEMO_REQUIRES_EMPTY_WORKSPACE") {
    projects(limit: 1) { id }
    materials(limit: 1) { id }
    documents(limit: 1) { id }
    extractedRows(limit: 1) { id }
    supplyOffers(limit: 1) { id }
    demandRequests(limit: 1) { id }
    routeDistances(limit: 1) { id }
    optimisationRuns(limit: 1) { id }
    allocationProposals(limit: 1) { id }
    transfers(limit: 1) { id }
    transferEvents(limit: 1) { id }
    emissionFactors(limit: 1) { id }
    impactAssessments(limit: 1) { id }
    transferApprovalOperations(limit: 1) { id }
    transferWorkflowOperations(limit: 1) { id }
    transferRequestOperations(limit: 1) { id }
    optimisationRunOperations(limit: 1) { id }
    demandCommitmentBalances(limit: 1) { demandRequestId }
    impactAssessmentHeads(limit: 1) { id }
    impactCalculationOperations(limit: 1) { id }
    ingestionBatches(limit: 1) { id }
    ingestionRevisions(limit: 1) { id }
    registeredMaterials(limit: 1) { id }
    projectMaterialRecords(limit: 1) { id }
    projectStockHeads(limit: 1) { id }
    supersededRecords(limit: 1) { id }
    ingestionPublications(limit: 1) { id }
    matchingScopes(limit: 1) { id }
    matchingGenerations(limit: 1) { id }
    runtimeAudits(limit: 1) { id }
    impactRefreshIntents(limit: 1) { id }
    workspaceIdentities(limit: 1) { id }
  }
  encoding: query @redact @check(expr: "response.encoding.quantityEncoding != null && response.encoding.quantityEncoding.version == 'millionths-v1'", message: "DEMO_REQUIRES_EXACT_QUANTITIES") {
    quantityEncoding(id: "GLOBAL") { version }
  }

  project_upsertMany(data: $projects)
  material_upsertMany(data: $materials)
  document_upsertMany(data: $documents)
  extractedRow_upsertMany(data: $extractedRows)
  supplyOffer_upsertMany(data: $supplyOffers)
  demandRequest_upsertMany(data: $demandRequests)
  routeDistance_upsertMany(data: $routeDistances)
  emissionFactor_upsertMany(data: $emissionFactors)
  optimisationRun_upsertMany(data: $optimisationRuns)
  allocationProposal_upsertMany(data: $allocationProposals)
  transfer_upsertMany(data: $transfers)
  transferEvent_upsertMany(data: $transferEvents)
  impactAssessment_upsertMany(data: $impactAssessments)
  demandCommitmentBalance_upsertMany(data: $demandCommitmentBalances)
  impactAssessmentHead_upsertMany(data: $impactAssessmentHeads)
  workspaceIdentity_insert(data: {id: "GLOBAL" epoch: $epoch createdAt: $createdAt})
  runtimeAudit_insert(data: {id: "DEMO-WORKSPACE-BOOTSTRAP" kind: "DEMO_BOOTSTRAP" payload: $receipt})
}
