mutation PersistCurrentActualImpact(
  $scopeId: String!
  $operationId: String!
  $requestFingerprint: String!
  $assessmentId: String!
  $expectedRevision: Int!
  $newRevision: Int!
  $inputFingerprint: String!
  $calculatedAt: Timestamp!
  $assessment: ImpactAssessment_Data! @allow(fields: "id basis proposalId transferId quantityAssessed unit baselineDescription avoidedProductionKgco2E additionalTransportKgco2E additionalProcessingKgco2E netAvoidedKgco2E factorIds assumptions calculationStatus calculatedAt")
  $transferId: String!
  $expectedUsedQuantity: Int64!
  $expectedDispatchedQuantity: Int64!
  $expectedReceivedQuantity: Int64!
  $expectedReuseConfirmedAt: Timestamp!
  $expectedOperationalRevision: Int!
  $intentToken: String!
  $intentPayload: Any!
) @auth(level: NO_ACCESS) @transaction {
  operationalVersion_updateMany(where: {id: {eq: "GLOBAL"} revision: {eq: $expectedOperationalRevision}}, data: {revision_update: {inc: 1}}) @check(expr: "this == 1", message: "IMPACT_INPUT_STALE")
  impactRefreshIntent_updateMany(where: {id: {eq: $transferId} token: {eq: $intentToken} status: {in: ["PENDING","FAILED"]}},data: {status: "COMPLETED" payload: $intentPayload}) @check(expr: "this == 1", message: "IMPACT_INTENT_STALE")
  transfer_updateMany(where: {id: {eq: $transferId} actuallyUsedQuantity: {eq: $expectedUsedQuantity} dispatchedQuantity: {eq: $expectedDispatchedQuantity} receivedQuantity: {eq: $expectedReceivedQuantity} reuseConfirmedAt: {eq: $expectedReuseConfirmedAt}}, data: {actuallyUsedQuantity: $expectedUsedQuantity}) @check(expr: "this == 1", message: "IMPACT_SOURCE_STALE")
  impactAssessment_insert(data: $assessment)
  impactAssessmentHead_updateMany(where: {id: {eq: $scopeId} revision: {eq: $expectedRevision}}, data: {currentAssessmentId: $assessmentId revision: $newRevision inputFingerprint: $inputFingerprint updatedAt: $calculatedAt}) @check(expr: "this == 1", message: "IMPACT_REVISION_STALE")
  impactCalculationOperation_insert(data: {id: $operationId requestFingerprint: $requestFingerprint scopeId: $scopeId assessmentId: $assessmentId})
}

mutation EnqueueImpactPolicyRefresh($id: String!, $token: String!, $payload: Any!, $expectedOperationalRevision: Int!) @auth(level: NO_ACCESS) @transaction {
  operationalVersion_updateMany(where: {id: {eq: "GLOBAL"} revision: {eq: $expectedOperationalRevision}},data: {revision_update: {inc: 1}}) @check(expr: "this == 1", message: "IMPACT_INPUT_STALE")
  impactRefreshIntent_upsert(data: {id: $id token: $token status: "PENDING" payload: $payload})
}
mutation ReactivateMatchingGeneration($id: String!, $materialId: String!, $token: String!, $fingerprint: String!, $expectedRevision: Int!) @auth(level: NO_ACCESS) @transaction {
  operationalVersion_updateMany(where: {id: {eq: "GLOBAL"} revision: {eq: $expectedRevision}},data: {revision_update: {inc: 1}}) @check(expr: "this == 1", message: "MATCHING_INPUT_STALE")
  query @redact @check(expr: "response.query.matchingGeneration.materialId == vars.materialId && response.query.matchingGeneration.fingerprint == vars.fingerprint",message: "MATCHING_INPUT_STALE") {
    matchingGeneration(id: $id) { materialId fingerprint }
  }
  matchingScope_updateMany(where: {id: {eq: $materialId} token: {eq: $token} status: {eq: "PENDING"}},data: {status: "CURRENT" generationId: $id payload: {}}) @check(expr: "this == 1",message: "MATCHING_SCOPE_STALE")
}
